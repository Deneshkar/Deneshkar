name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
    - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - name: Generate Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00f5ff&color_dots=#0d1117,#302b63,#5c54a4,#8479e1,#a78bfa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Speed up animation
        run: |
          if [ -f dist/github-snake-dark.svg ]; then
            cat dist/github-snake-dark.svg | sed 's/[0-9][0-9]*ms/10000ms/g' > dist/tmp.svg
            mv dist/tmp.svg dist/github-snake-dark.svg
          else
            echo "Error: dist/github-snake-dark.svg not found."
            ls -la dist/ || echo "dist directory does not exist"
            exit 1
          fi

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
