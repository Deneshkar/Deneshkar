name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    name: generate-snake
    steps:
      - uses: actions/checkout@v4

      - name: Contribution Snake
        uses: Platane/snk@v3
        with:
          github_user_name: Deneshkar
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=e94560&color_dots=0d1117,1a1a2e,16213e,0f3460,e94560
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=e94560&color_dots=0d1117,1a1a2e,16213e,0f3460,e94560

      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
